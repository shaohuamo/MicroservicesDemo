# Infrastructure deployment pipeline
# Deploys shared dev infrastructure to AKS using raw Kubernetes manifests.
#
# Design:
# - align runtime images and service names with docker/deploy/docker-compose.yml
# - use native manifests like the business service pipelines
# - generate configmaps and secrets from repo config files and Key Vault-backed variables
#
# K8s service name mapping (referenced by business service manifests):
#   postgres:5432
#   redis:6379
#   rabbitmq:5672
#   postgres-exporter:9187
#   redis-exporter:9121
#   prometheus:9090
#   alertmanager:9093
#   grafana:3000
#   jaeger:4317 / :16686
#   loki:3100
#   otel-collector:4317 / :4318 / :8888
#
# Notes:
# - AKS application routing is managed separately by aks/pipelines/azure-pipelines-cluster-addons.yaml
# - this pipeline also reconciles the dev application connection secrets so service-name changes stay in sync

trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - aks/manifests/dev/infrastructure/**
      - aks/pipelines/azure-pipelines-infrastructure.yaml
      - configs/**

resources:
  - repo: self

variables:
  - group: infrastructure-key-vault     # Linked to Key Vault microservicesdemo-kv
                                         # Secrets: postgres-password, rabbitmq-password,
                                         #   alertmanager-slack-webhook, postgres-exporter-password,
                                         #   redis-connection-string, gateway-proof-key,
                                         #   gateway-db-password
  - name: k8sServiceConnection
    value: dev-microservicesdemo-aks-cluster-dev-1778160743494
  - name: azureSubscription
    value: microservicesdemo-resource-group-connection
  - name: namespace
    value: dev
  - name: vmImageName
    value: ubuntu-latest
  - name: aksResourceGroup
    value: microservicesdemo-resource-group
  - name: aksClusterName
    value: microservicesdemo-aks-cluster

stages:
  - stage: DeployInfrastructure
    displayName: Deploy Infrastructure to Dev
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/dev')
    jobs:
      - deployment: DeployInfrastructureToDev
        displayName: Deploy Infrastructure (Dev)
        pool:
          vmImage: $(vmImageName)
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source code

                - task: KubernetesManifest@1
                  displayName: Apply dev namespace manifest
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: $(k8sServiceConnection)
                    namespace: $(namespace)
                    manifests: aks/manifests/dev/infrastructure/00-namespace.yaml

                - task: AzureCLI@2
                  displayName: Create or update infrastructure configmaps and secrets
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                      kubectl apply -f aks/manifests/dev/infrastructure/00-namespace.yaml

                      kubectl -n $(namespace) create configmap postgres-config \
                        --from-file=postgresql.conf=configs/postgres/conf/postgresql.conf \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create configmap postgres-init-scripts \
                        --from-file=configs/postgres/init \
                        --dry-run=client -o yaml | kubectl apply --server-side -f -

                      kubectl -n $(namespace) create configmap postgres-exporter-queries \
                        --from-file=queries.yaml=configs/postgres-exporter/queries.yaml \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create configmap rabbitmq-enabled-plugins \
                        --from-file=enabled_plugins=configs/rabbitmq/enabled_plugins \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create configmap otel-collector-config \
                        --from-file=config.yaml=aks/manifests/dev/infrastructure/assets/otel-collector-config.tmpl \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create configmap prometheus-config \
                        --from-file=prometheus.yml=aks/manifests/dev/infrastructure/assets/prometheus.yml \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create configmap prometheus-rules \
                        --from-file=configs/prometheus/rules \
                        --dry-run=client -o yaml | kubectl apply --server-side -f -

                      kubectl -n $(namespace) create configmap grafana-datasources \
                        --from-file=datasource.yaml=configs/grafana/datasource.yml \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create configmap grafana-dashboards \
                        --from-file=configs/grafana/dashboards \
                        --dry-run=client -o yaml | kubectl apply --server-side -f -

                      kubectl -n $(namespace) create configmap promtail-config \
                        --from-file=config.yml=aks/manifests/dev/infrastructure/assets/promtail-config.yml \
                        --dry-run=client -o yaml | kubectl apply -f -

                      escaped_webhook=$(printf '%s' '$(alertmanager-slack-webhook)' | sed 's/[&]/\\&/g')
                      sed "s|__SLACK_WEBHOOK__|$escaped_webhook|g" \
                        aks/manifests/dev/infrastructure/assets/alertmanager.yml.tmpl > alertmanager.yml

                      kubectl -n $(namespace) create secret generic postgres-infra-secret \
                        --from-literal=postgres-password='$(postgres-password)' \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create secret generic gateway-auth-secrets \
                        --from-literal=proof-key-id='v1' \
                        --from-literal=proof-key="$GATEWAY_PROOF_KEY" \
                        --from-literal=postgres-password="$GATEWAY_DB_PASSWORD" \
                        --from-literal=postgres-connection-string='Host=postgres;Port=5432;Database=adminwebdatabase;Username=gateway_auth_reader;Pooling=true;Maximum Pool Size=20;Timeout=3;Command Timeout=3' \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create secret generic postgres-exporter-secret \
                        --from-literal=DATA_SOURCE_NAME='postgresql://exporter:$(postgres-exporter-password)@postgres:5432/productsdatabase?sslmode=disable' \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create secret generic rabbitmq-infra-secret \
                        --from-literal=rabbitmq-password='$(rabbitmq-password)' \
                        --dry-run=client -o yaml | kubectl apply -f -

                      kubectl -n $(namespace) create secret generic alertmanager-config \
                        --from-file=alertmanager.yml=alertmanager.yml \
                        --dry-run=client -o yaml | kubectl apply -f -

                      rm -f alertmanager.yml
                  env:
                    GATEWAY_PROOF_KEY: $(gateway-proof-key)
                    GATEWAY_DB_PASSWORD: $(gateway-db-password)

                - task: KubernetesManifest@1
                  displayName: Deploy data services
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: $(k8sServiceConnection)
                    namespace: $(namespace)
                    manifests: aks/manifests/dev/infrastructure/10-data-services.yaml
                    rolloutStatusTimeout: 300

                - task: AzureCLI@2
                  displayName: Ensure application databases exist
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                      for database in productsdatabase identitydatabase adminwebdatabase notificationsdatabase; do
                        DATABASE_EXISTS=$(kubectl -n $(namespace) exec deploy/postgres -- \
                          psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$database'" | tr -d '[:space:]')

                        if [ "$DATABASE_EXISTS" != "1" ]; then
                          kubectl -n $(namespace) exec deploy/postgres -- \
                            psql -U postgres -c "CREATE DATABASE \"$database\""
                        fi
                      done

                      kubectl -n $(namespace) exec -i deploy/postgres -- \
                        psql -v ON_ERROR_STOP=1 -U postgres -d postgres < configs/postgres/init/create-notifications-table-and-indexes.sql

                      kubectl -n $(namespace) exec -i deploy/postgres -- \
                        psql -v ON_ERROR_STOP=1 -U postgres -d postgres < configs/postgres/init/create-admin-web-refresh-tokens-table-and-index.sql

                      kubectl -n $(namespace) exec -i deploy/postgres -- \
                        psql -v ON_ERROR_STOP=1 -U postgres -d postgres < configs/postgres/init/create-gateway-auth-reader.sql

                - task: KubernetesManifest@1
                  displayName: Deploy observability services
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: $(k8sServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      aks/manifests/dev/infrastructure/20-observability.yaml
                      aks/manifests/dev/infrastructure/21-promtail.yaml
                    rolloutStatusTimeout: 300
