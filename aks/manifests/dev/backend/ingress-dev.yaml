apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-dev
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "64k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - api.250669.xyz
        - 250669.xyz
        - auth.250669.xyz
        - grafana.250669.xyz
        - jaeger.250669.xyz
      secretName: microservices-tls-dev
  rules:
    # API Gateway - entry point for all backend API traffic
    - host: api.250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apigateway-service
                port:
                  number: 8080

    # Admin Web - frontend application
    - host: 250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-web-service
                port:
                  number: 3000

    # IdentityServer - public OIDC authority and login endpoint
    - host: auth.250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identityserver-service
                port:
                  number: 8080

    # Grafana - observability dashboards
    - host: grafana.250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

    # Jaeger - distributed tracing UI
    - host: jaeger.250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686

    # NOTE: products-microservice and notifications-microservice are intentionally NOT exposed
    # externally. All backend API traffic must go through the API Gateway.
