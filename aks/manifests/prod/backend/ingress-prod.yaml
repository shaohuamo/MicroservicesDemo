apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-prod
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - api.250669.xyz
        - 250669.xyz
        - auth.250669.xyz
      secretName: microservices-tls-prod
  rules:
    # API Gateway - entry point for all backend API traffic
    - host: api.250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apigateway-service
                port:
                  number: 8080

    # Admin Web - frontend application
    - host: 250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-web-service
                port:
                  number: 3000

    # IdentityServer - public OIDC authority and login endpoint
    - host: auth.250669.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identityserver-service
                port:
                  number: 8080

    # NOTE: products-microservice and notifications-microservice are intentionally NOT exposed
    # externally. All backend API traffic must go through the API Gateway.
