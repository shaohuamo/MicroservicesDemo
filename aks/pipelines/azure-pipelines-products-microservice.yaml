# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/backend/Services/Products/**
    - src/backend/BuildingBlocks/CommonService/**
    - tests/ProductsServiceUnitTests/**
    - aks/manifests/dev/backend/products-microservice-dev.yaml
    - aks/manifests/qa/backend/products-microservice-qa.yaml
    - aks/manifests/uat/backend/products-microservice-uat.yaml
    - aks/manifests/staging/backend/products-microservice-staging.yaml
    - aks/manifests/prod/backend/products-microservice-prod.yaml
    - aks/manifests/shared/backend/products-database-migration.yaml
    - aks/manifests/shared/backend/products-gateway-network-policy.yaml
    - aks/pipelines/templates/products-migration-job-steps.yaml
    - aks/pipelines/azure-pipelines-products-microservice.yaml

resources:
- repo: self

variables:
  # Reference global variable groups for Docker registry and runtime secrets.
  - group: products-microservice-global
  - group: infrastructure-key-vault
  
  # Explicit path avoids picking up Dockerfiles from other services (Gateway, etc.)
  - name: dockerfilePath
    value: 'src/backend/Services/Products/ProductsMicroService.API/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

  # Agent VM image name
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context must be the repo root: the Dockerfile COPYs files using
        # paths relative to the solution root (e.g. src/backend/BuildingBlocks/...)
        buildContext: $(Build.SourcesDirectory)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Test
  displayName: Run unit tests
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Test
    displayName: Unit Tests
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 9 SDK
      inputs:
        packageType: sdk
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: Run unit tests
      inputs:
        command: test
        projects: 'tests/ProductsServiceUnitTests/ProductsServiceUnitTests.csproj'
        arguments: '--configuration Release --logger trx --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/TestResults'
        publishTestResults: false

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      condition: always()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

- stage: DeployToDev
  displayName: Deploy to Dev
  lockBehavior: sequential
  dependsOn: Test
  condition: and(succeeded('Test'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - pwsh: |
              function ConvertTo-Base64([string]$name, [string]$value) {
                if ([string]::IsNullOrWhiteSpace($value)) {
                  throw "Products secret value '$name' is empty."
                }

                [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($value))
              }

              $target = "$(Pipeline.Workspace)/products-secrets-dev.yaml"
              $secretData = [ordered]@{
                "postgres-host" = "postgres"
                "postgres-user" = "postgres"
                "postgres-password" = $env:PRODUCTS_POSTGRES_PASSWORD
                "rabbitmq-host" = "rabbitmq"
                "rabbitmq-user" = "guest"
                "rabbitmq-password" = $env:PRODUCTS_RABBITMQ_PASSWORD
                "redis-connection-string" = $env:PRODUCTS_REDIS_CONNECTION_STRING
              }

              $lines = @(
                "apiVersion: v1"
                "kind: Secret"
                "metadata:"
                "  name: products-secrets"
                "  namespace: dev"
                "type: Opaque"
                "data:"
              )

              foreach ($item in $secretData.GetEnumerator()) {
                $lines += "  $($item.Key): $(ConvertTo-Base64 $item.Key $item.Value)"
              }

              Set-Content -Path $target -Value ($lines -join [Environment]::NewLine)
            displayName: Render Products secrets manifest for dev namespace
            env:
              PRODUCTS_POSTGRES_PASSWORD: $(postgres-password)
              PRODUCTS_RABBITMQ_PASSWORD: $(rabbitmq-password)
              PRODUCTS_REDIS_CONNECTION_STRING: $(redis-connection-string)

          - task: KubernetesManifest@1
            displayName: Apply Products secrets in dev namespace
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: |
                $(Pipeline.Workspace)/products-secrets-dev.yaml

          - template: templates/products-migration-job-steps.yaml
            parameters:
              namespace: dev
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494

          - task: KubernetesManifest@1
            displayName: Restrict Products ingress to Gateway in dev
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: aks/manifests/shared/backend/products-gateway-network-policy.yaml

          - task: KubernetesManifest@1
            displayName: Deploy Products microservice to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: aks/manifests/dev/backend/products-microservice-dev.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

- stage: DeployToQA
  displayName: Deploy to QA
  lockBehavior: sequential
  dependsOn: Test
  condition: and(succeeded('Test'), eq(variables['Build.SourceBranch'], 'refs/heads/qa'))
  jobs:
  - deployment: DeploymentToQA
    displayName: Deployment to QA Environment
    pool:
      vmImage: $(vmImageName)
    environment: qa
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - task: KubernetesManifest@1
            displayName: Create Products secrets in qa namespace
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: qa-microservicesdemo-aks-cluster-qa-1778160953610
              namespace: qa
              secretType: generic
              secretName: products-secrets
              forceUpdate: true
              secretArguments: |
                --from-literal=postgres-host=postgres
                --from-literal=postgres-user=postgres
                --from-literal=postgres-password=$(postgres-password)
                --from-literal=rabbitmq-host=rabbitmq
                --from-literal=rabbitmq-user=guest
                --from-literal=rabbitmq-password=$(rabbitmq-password)
                --from-literal=redis-connection-string=$(redis-connection-string)

          - template: templates/products-migration-job-steps.yaml
            parameters:
              namespace: qa
              kubernetesServiceConnection: qa-microservicesdemo-aks-cluster-qa-1778160953610

          - task: KubernetesManifest@1
            displayName: Restrict Products ingress to Gateway in qa
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: qa-microservicesdemo-aks-cluster-qa-1778160953610
              namespace: qa
              manifests: aks/manifests/shared/backend/products-gateway-network-policy.yaml

          - task: KubernetesManifest@1
            displayName: Deploy Products microservice to qa namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: qa-microservicesdemo-aks-cluster-qa-1778160953610
