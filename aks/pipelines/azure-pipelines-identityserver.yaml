# Docker
# Build and push the IdentityServer image to Azure Container Registry, then deploy to AKS.

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
      - src/backend/IdentityServer/**
      - aks/manifests/*/backend/identityserver-*.yaml
      - aks/pipelines/azure-pipelines-identityserver.yaml

resources:
  - repo: self

variables:
  # Reference global variable groups for Docker registry, IdentityServer configuration, and runtime secrets.
  - group: admin-web-global
  - group: identityserver-global
  - group: infrastructure-key-vault
  - group: identityserver-key-vault

  - name: dockerfilePath
    value: 'src/backend/IdentityServer/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push an image to container registry
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: $(Build.SourcesDirectory)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  - stage: DeployToDev
    displayName: Deploy to Dev
    dependsOn: Build
    condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeploymentToDev
        displayName: Deployment to Dev Environment
        pool:
          vmImage: $(vmImageName)
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source code

                - pwsh: |
                    $pfxPath = "$(Pipeline.Workspace)/identityserver-signing-prod.pfx"
                    $pfxBase64 = $env:IDENTITYSERVER_SIGNING_PFX_BASE64

                    if ([string]::IsNullOrWhiteSpace($pfxBase64) -or $pfxBase64.Contains('$(')) {
                      throw "Pipeline variable 'identityserver-signing-pfx-base64' is empty or not defined."
                    }

                    [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($pfxBase64))
                  displayName: Prepare IdentityServer signing certificate file
                  env:
                    IDENTITYSERVER_SIGNING_PFX_BASE64: $(identityserver-signing-pfx-base64)

                - pwsh: |
                    function ConvertTo-Base64([string]$name, [string]$value) {
                      if ([string]::IsNullOrWhiteSpace($value) -or $value.Contains('$(')) {
                        throw "IdentityServer secret value '$name' is empty or not defined."
                      }

                      [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($value))
                    }

                    $pfxBase64 = $env:IDENTITYSERVER_SIGNING_PFX_BASE64
                    if ([string]::IsNullOrWhiteSpace($pfxBase64) -or $pfxBase64.Contains('$(')) {
                      throw "Pipeline variable 'identityserver-signing-pfx-base64' is empty or not defined."
                    }

                    $target = "$(Pipeline.Workspace)/identityserver-secrets-dev.yaml"
                    $secretData = [ordered]@{
                      "postgres-host" = "postgres"
                      "postgres-user" = "postgres"
                      "postgres-password" = $env:IDENTITYSERVER_POSTGRES_PASSWORD
                      "identityserver-signing-cert-password" = $env:IDENTITYSERVER_SIGNING_CERT_PASSWORD
                      "resend-email-api-token" = $env:RESEND_EMAIL_API_TOKEN
                      "identityserver-signing-prod.pfx" = $pfxBase64
                    }

                    $lines = @(
                      "apiVersion: v1"
                      "kind: Secret"
                      "metadata:"
                      "  name: identityserver-secrets"
                      "  namespace: dev"
                      "type: Opaque"
                      "data:"
                    )

                    foreach ($item in $secretData.GetEnumerator()) {
                      if ($item.Key -eq "identityserver-signing-prod.pfx") {
                        $lines += "  $($item.Key): $($item.Value)"
                      }
                      else {
                        $lines += "  $($item.Key): $(ConvertTo-Base64 $item.Key $item.Value)"
                      }
                    }

                    Set-Content -Path $target -Value ($lines -join [Environment]::NewLine)
                  displayName: Render IdentityServer secrets manifest for dev namespace
                  env:
                    IDENTITYSERVER_POSTGRES_PASSWORD: $(postgres-password)
                    IDENTITYSERVER_SIGNING_CERT_PASSWORD: $(identityserver-signing-cert-password)
                    IDENTITYSERVER_SIGNING_PFX_BASE64: $(identityserver-signing-pfx-base64)
                    RESEND_EMAIL_API_TOKEN: $(resend-email-api-token)

                - task: KubernetesManifest@1
                  displayName: Apply IdentityServer secrets in dev namespace
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
                    namespace: dev
                    manifests: |
                      $(Pipeline.Workspace)/identityserver-secrets-dev.yaml

                - pwsh: |
                    Remove-Item -LiteralPath "$(Pipeline.Workspace)/identityserver-signing-prod.pfx" -ErrorAction SilentlyContinue
                  displayName: Remove temporary IdentityServer signing certificate file
                  condition: always()

                - pwsh: |
                    $source = "aks/manifests/dev/backend/identityserver-dev.yaml"
                    $target = "$(Pipeline.Workspace)/identityserver-dev.rendered.yaml"
                    $emailVerificationRateLimitEnabled = '$(EMAIL_VERIFICATION_RATE_LIMIT_ENABLED)'
                    if ([string]::IsNullOrWhiteSpace($emailVerificationRateLimitEnabled) -or $emailVerificationRateLimitEnabled.Contains('$(')) {
                      $emailVerificationRateLimitEnabled = "true"
                    }

                    (Get-Content $source -Raw) `
                      -replace '\$\(tag\)', '$(tag)' `
                      -replace '\$\(POSTGRES_USER\)', '$(POSTGRES_USER)' `
                      -replace '\$\(POSTGRES_PASSWORD\)', '$(POSTGRES_PASSWORD)' `
                      -replace '\$\(IDENTITYSERVER_PUBLIC_URL\)', '$(IDENTITYSERVER_PUBLIC_URL)' `
                      -replace '\$\(EMAIL_VERIFICATION_RATE_LIMIT_ENABLED\)', $emailVerificationRateLimitEnabled `
                      -replace '\$\(IDENTITYSERVER_SEED_USER_NAME\)', '$(IDENTITYSERVER_SEED_USER_NAME)' `
                      -replace '\$\(IDENTITYSERVER_SEED_USER_EMAIL\)', '$(IDENTITYSERVER_SEED_USER_EMAIL)' `
                      -replace '\$\(IDENTITYSERVER_SEED_USER_PASSWORD\)', '$(IDENTITYSERVER_SEED_USER_PASSWORD)' `
                      -replace '\$\(FRONTEND_PUBLIC_URL\)', '$(FRONTEND_PUBLIC_URL)' `
                      -replace '\$\(IDENTITYSERVER_FRONTEND_CLIENT_ID\)', '$(IDENTITYSERVER_FRONTEND_CLIENT_ID)' `
                      -replace '\$\(IDENTITYSERVER_FRONTEND_CLIENT_SECRET\)', '$(identityserver-frontend-client-secret)' |
                      Set-Content $target
                  displayName: Render IdentityServer dev manifest

                - task: KubernetesManifest@1
                  displayName: Deploy IdentityServer to dev namespace in kubernetes
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
                    namespace: dev
                    manifests: |
                      $(Pipeline.Workspace)/identityserver-dev.rendered.yaml
                    containers: |
                      $(containerRegistry)/$(imageRepository):$(tag)

  - stage: DeployToQA
