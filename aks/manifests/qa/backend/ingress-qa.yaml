apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-qa
  namespace: qa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - apigateway.qa.example.com
        - admin.qa.example.com
      secretName: microservices-tls-qa
  rules:
    # API Gateway - entry point for all backend API traffic
    - host: apigateway.qa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apigateway-service
                port:
                  number: 8080

    # Admin Web - frontend application
    - host: admin.qa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-web-service
                port:
                  number: 3000

    # NOTE: products-microservice and notifications-microservice are intentionally NOT exposed
    # externally. All backend API traffic must go through the API Gateway.
