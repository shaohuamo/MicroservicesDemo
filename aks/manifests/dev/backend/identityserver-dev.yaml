apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityserver-deployment
  labels:
    app: identityserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identityserver
  template:
    metadata:
      labels:
        app: identityserver
    spec:
      containers:
      - name: identityserver
        image: microservicesdemoregistry.azurecr.io/identityserver:$(tag)
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: POSTGRES__HOST
          valueFrom:
            secretKeyRef:
              name: identityserver-secrets
              key: postgres-host
        - name: POSTGRES__PORT
          value: "5432"
        - name: POSTGRES__DATABASE
          value: "identitydatabase"
        - name: POSTGRES__USER
          valueFrom:
            secretKeyRef:
              name: identityserver-secrets
              key: postgres-user
        - name: POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: identityserver-secrets
              key: postgres-password
        - name: POSTGRES__MaxRetryCount
          value: "5"
        - name: POSTGRES__MaxRetryDelaySeconds
          value: "10"
        - name: IdentityServer__SigningCredential__CertificatePath
          value: "/app/certs/identityserver-signing-prod.pfx"
        - name: IdentityServer__SigningCredential__CertificatePassword
          valueFrom:
            secretKeyRef:
              name: identityserver-secrets
              key: identityserver-signing-cert-password
        - name: IdentityServer__IssuerUri
          value: "$(IDENTITYSERVER_PUBLIC_URL)"
        - name: ResendEmail__ApiToken
          valueFrom:
            secretKeyRef:
              name: identityserver-secrets
              key: resend-email-api-token
        - name: ResendEmail__From
          value: "MicroservicesDemo <verify@auth.250669.xyz>"
        - name: ResendEmail__PublicBaseUrl
          value: "$(IDENTITYSERVER_PUBLIC_URL)"
        - name: ResendEmail__ConfirmationSubject
          value: "Confirm your MicroservicesDemo account"
        - name: Redis__ConnectionString
          value: "redis:6379"
        - name: Redis__InstanceName
          value: "IdentityServer_"
        - name: EmailVerificationRateLimit__Enabled
          value: "$(EMAIL_VERIFICATION_RATE_LIMIT_ENABLED)"
        - name: IdentityServer__TokenLifetimes__AccessTokenSeconds
          value: "900"
        - name: IdentityServer__TokenLifetimes__AbsoluteRefreshTokenSeconds
          value: "2592000"
        - name: SeedUser__Enabled
          value: "true"
        - name: SeedUser__UserName
          value: "$(IDENTITYSERVER_SEED_USER_NAME)"
        - name: SeedUser__Email
          value: "$(IDENTITYSERVER_SEED_USER_EMAIL)"
        - name: SeedUser__Password
          value: "$(IDENTITYSERVER_SEED_USER_PASSWORD)"
        - name: Clients__Frontend__PublicUrl
          value: "$(FRONTEND_PUBLIC_URL)"
        - name: Clients__Frontend__ClientId
          value: "$(IDENTITYSERVER_FRONTEND_CLIENT_ID)"
        - name: Clients__Frontend__ClientSecret
          value: "$(IDENTITYSERVER_FRONTEND_CLIENT_SECRET)"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=Production"
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: identityserver-signing-cert
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: identityserver-signing-cert
        secret:
          secretName: identityserver-secrets
          items:
          - key: identityserver-signing-prod.pfx
            path: identityserver-signing-prod.pfx
---
apiVersion: v1
kind: Service
metadata:
  name: identityserver-service
  labels:
    app: identityserver
spec:
  selector:
    app: identityserver
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
