                      -replace '\$\(POSTGRES_PASSWORD\)', '$(POSTGRES_PASSWORD)' `
                      -replace '\$\(IDENTITYSERVER_PUBLIC_URL\)', '$(IDENTITYSERVER_PUBLIC_URL)' `
                      -replace '\$\(EMAIL_VERIFICATION_RATE_LIMIT_ENABLED\)', $emailVerificationRateLimitEnabled `
                      -replace '\$\(FRONTEND_PUBLIC_URL\)', '$(FRONTEND_PUBLIC_URL)' `
                      -replace '\$\(IDENTITYSERVER_FRONTEND_CLIENT_ID\)', '$(IDENTITYSERVER_FRONTEND_CLIENT_ID)' `
                      -replace '\$\(IDENTITYSERVER_FRONTEND_CLIENT_SECRET\)', '$(identityserver-frontend-client-secret)' |
                      Set-Content $target
                  displayName: Render IdentityServer qa manifest

                - task: KubernetesManifest@1
                  displayName: Deploy IdentityServer to qa namespace in kubernetes
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: qa-microservicesdemo-aks-cluster-qa-1778160953610
                    namespace: qa
