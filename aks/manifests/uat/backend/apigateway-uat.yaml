apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
  labels:
    app: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway
        image: microservicesdemoregistry.azurecr.io/apigateway:$(tag)
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=apigateway,deployment.environment=uat"
        - name: Authentication__Authority
          value: "$(IDENTITYSERVER_PUBLIC_URL)"
        - name: Authentication__MetadataAddress
          value: "http://identityserver-service:8080/.well-known/openid-configuration"
        - name: Authentication__Audience
          value: "gateway-api"
        - name: Authentication__RequireHttpsMetadata
          value: "false"
        - name: Authentication__DenylistRedisConnectionString
          value: "redis:6379"
        - name: Authentication__AccessTokenDenylistPrefix
          value: "admin-web:access-token-denylist"
        - name: Authentication__DenylistFailClosed
          value: "true"
        - name: Routes__0__RateLimitOptions__Limit
          value: "$(OCELOT_LIMIT)"
        - name: Routes__0__RateLimitOptions__Period
          value: "$(OCELOT_PERIOD)"
        - name: Routes__0__RateLimitOptions__ClientWhitelist__0
          value: "$(APP_WHITELIST_1)"
        - name: Routes__1__RateLimitOptions__Limit
          value: "$(OCELOT_LIMIT)"
        - name: Routes__1__RateLimitOptions__Period
          value: "$(OCELOT_PERIOD)"
        - name: Routes__1__RateLimitOptions__ClientWhitelist__0
          value: "$(APP_WHITELIST_1)"
        - name: Routes__2__RateLimitOptions__Limit
          value: "$(OCELOT_LIMIT)"
        - name: Routes__2__RateLimitOptions__Period
          value: "$(OCELOT_PERIOD)"
        - name: Routes__2__RateLimitOptions__ClientWhitelist__0
          value: "$(APP_WHITELIST_1)"
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  labels:
    app: apigateway
spec:
  selector:
    app: apigateway
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
